<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Norie</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Norie">
<link rel="manifest" href="manifest.json?v=12">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --pink:#f4687f; --pink2:#ffc4cd; --pink3:#ffe8ec;
  --gold:#c8962e; --gold2:#f4d98f;
  --cream:#fff8ee; --ink:#3a2a30; --muted:#8f7a80;
  --glass:rgba(255,255,255,.46); --glass-b:rgba(255,255,255,.75);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;-webkit-user-select:auto;user-select:auto}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Segoe UI,Roboto,sans-serif;
  color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;transform:translateZ(0);
  background-image:
    radial-gradient(60vmax 60vmax at 0% 0%, rgba(255,165,178,.55), transparent 60%),
    radial-gradient(55vmax 55vmax at 100% 10%, rgba(244,217,143,.65), transparent 60%),
    radial-gradient(60vmax 60vmax at 80% 100%, rgba(255,190,200,.5), transparent 60%),
    radial-gradient(50vmax 50vmax at 0% 100%, rgba(244,217,143,.45), transparent 60%);
}
.glass{
  background:rgba(255,253,243,.46);
  border:1px solid var(--glass-b);
  box-shadow:0 10px 32px rgba(200,150,46,.14), 0 2px 8px rgba(244,104,127,.08), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.3);
  border-radius:var(--r);
}
.bar.glass,.toast.glass{-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.bar.glass{background:var(--glass)}
#sheet .glass{background:var(--glass)}
#app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 120px)}
h1{font-size:34px;letter-spacing:-.8px;margin:6px 4px 2px;font-weight:800}
.sub{margin:0 4px 16px;color:var(--muted);font-size:15px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--gold);margin:22px 8px 8px;font-weight:700}
h2.over{color:var(--pink)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hi{margin:6px 4px 0;color:var(--gold);font-weight:700;font-size:15px}
.mini-av{flex:none;width:60px;height:60px;font-size:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);border:1px solid var(--glass-b);box-shadow:0 6px 18px rgba(244,104,127,.2), inset 0 1.5px 0 #fff;cursor:pointer;overflow:hidden}
.mini-av svg{width:88%;height:88%}
.mini-av img,.hello-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-emoji{line-height:1}
.card{padding:6px 0;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:rgba(160,120,100,.14)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--pink2);background:rgba(255,255,255,.6);display:grid;place-items:center;transition:.2s;box-shadow:inset 0 1px 2px rgba(255,255,255,.9)}
.t{font-size:17px;font-weight:600;line-height:1.25}
.m{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.m .late{color:var(--pink);font-weight:600}

/* Ultra-compressed Completed Row */
.row.done{padding:4px 16px;opacity:.65;min-height:28px}
.row.done .chk{background:linear-gradient(135deg,var(--pink),#ff9aab);border-color:transparent;width:18px;height:18px}
.row.done .chk::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.done .t{text-decoration:line-through;color:var(--muted);font-size:13px;font-weight:500}
.row.done .m{display:none} 
.row.done+.row::before{left:42px}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.p1{background:var(--gold)} .p2{background:var(--pink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.ring{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:6px}
.ring svg{flex:none}
.ring b{font-size:19px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;padding:6px;gap:2px;border-radius:30px;z-index:20;width:min(92vw,420px)}
.bar button{flex:1;border:0;background:none;padding:9px 0 7px;border-radius:24px;font:inherit;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
.bar button span{font-size:21px;line-height:1}
.bar button.on{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,232,236,.8));color:var(--pink);box-shadow:0 4px 14px rgba(244,104,127,.22), inset 0 1px 0 #fff}
.fab{position:fixed;right:max(18px,calc(50% - 322px));bottom:calc(env(safe-area-inset-bottom) + 98px);width:60px;height:60px;border-radius:50%;border:0;z-index:21;font-size:34px;color:#fff;cursor:pointer;background:linear-gradient(145deg,#ff9aab,var(--pink) 55%,#ea4a66);box-shadow:0 12px 28px rgba(244,104,127,.5), inset 0 2px 0 rgba(255,255,255,.55);line-height:1;padding-bottom:4px}
.fab:active{transform:scale(.94)}
#shade{position:fixed;inset:0;background:rgba(80,40,50,.28);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;margin:0 auto;bottom:-105%;width:min(680px,100%);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:31;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);border-radius:30px 30px 0 0;background:rgba(255,250,243,.98);pointer-events:none;transition:bottom .28s cubic-bezier(.2,.9,.25,1)}
#sheet.on{bottom:0;pointer-events:auto}
#sheet .grab{width:42px;height:5px;border-radius:5px;background:rgba(120,90,90,.25);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-top b{font-size:22px}
.x{border:0;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.75);color:var(--muted);font-size:15px;cursor:pointer}
label{display:block;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.7px;margin:14px 4px 6px}
input,select,textarea{
  position:relative;z-index:5;pointer-events:auto!important;
  -webkit-user-select:text!important;user-select:text!important;
  touch-action:manipulation;
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  padding:13px 14px;border-radius:15px;border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.85);outline:none;box-shadow:inset 0 1px 3px rgba(160,120,100,.1)
}
input:focus,select:focus,textarea:focus{border-color:var(--pink2);box-shadow:0 0 0 3px rgba(244,104,127,.18)}
input.big{font-size:21px;font-weight:600;padding:16px;border-radius:18px}
textarea{resize:none;min-height:66px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 6px 0}
.sec{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--gold);margin:20px 6px 8px;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;background:rgba(255,255,255,.75);font-weight:600;font-size:14px;color:var(--muted)}
.pill.on{color:var(--pink)}
.calnote{font-size:12.5px;color:var(--muted);margin:8px 6px 0;min-height:16px}
.grp{padding:2px 0;margin-top:18px}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;position:relative;min-height:52px}
.grow+.grow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:rgba(160,120,100,.14)}
.grow>span{font-size:16px;font-weight:600}
.grow select{width:auto;max-width:62%;border:0;background:none;box-shadow:none;padding:6px 4px;color:var(--pink);font-weight:600}
.sw{position:relative;width:51px;height:31px;flex:none;margin:0}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;z-index:2;border:0;box-shadow:none}
.sw i{position:absolute;inset:0;border-radius:31px;background:rgba(120,100,100,.25);transition:.25s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}
.sw input:checked+i{background:linear-gradient(145deg,#ff9aab,var(--pink))}
.sw input:checked+i::after{transform:translateX(20px)}
details.more{margin-top:14px}
details.more .grp{margin-top:6px;padding:4px 14px 14px}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{flex:1;border:0;padding:15px;border-radius:17px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff, 0 3px 10px rgba(200,150,46,.12)}
.btn.main{color:#fff;background:linear-gradient(145deg,#ff9aab,var(--pink));box-shadow:0 8px 20px rgba(244,104,127,.38), inset 0 1.5px 0 rgba(255,255,255,.5)}
.btn.gold{background:linear-gradient(145deg,var(--gold2),#e5b95a);color:#5b4210}
.btn.danger{color:#d23a62;flex:.6}
.btn.small{padding:10px 12px;font-size:14px;border-radius:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.chip{border:0;font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:20px;background:rgba(255,255,255,.65);color:var(--ink);cursor:pointer;box-shadow:inset 0 1px 0 #fff}
.chip.on{background:linear-gradient(145deg,#ff9aab,var(--pink));color:#fff}
.chip.em{font-size:22px;padding:6px 10px}
.lcard{padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;margin-bottom:10px}
.lcard .e{font-size:28px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--pink3),var(--gold2))}
.lcard .n{font-weight:700;font-size:17px}.lcard .c{margin-left:auto;color:var(--muted);font-weight:600}
.setrow{padding:16px}
.setrow p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.status{font-size:13px;font-weight:600;margin-top:8px}
.ok{color:#2f9e6a}.no{color:var(--pink)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:min(560px,94vw);z-index:50;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 16px;animation:drop .4s cubic-bezier(.2,.9,.25,1);background:rgba(255,255,255,.72)}
.toast b{display:block;font-size:16px;margin-bottom:2px}
.toast .tb{display:flex;gap:8px;margin-top:10px}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}

/* Details Settings styling */
details summary{cursor:pointer;font-weight:700;padding:4px 2px;font-size:15px;list-style:none;display:flex;align-items:center;justify-content:space-between;color:var(--ink)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾";color:var(--muted);font-size:18px;transition:transform .2s;font-weight:400}
details[open] summary::after{transform:rotate(180deg)}
details .setwrap{padding-top:12px;animation:drop .25s cubic-bezier(.2,.9,.25,1)}
a{color:var(--pink)}

/* robot optimizations */
.rbt{width:100%;height:100%;perspective:520px;perspective-origin:50% 45%;transform:translateZ(0)}
.rbt-3d{width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.rbt svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 7px 8px rgba(190,70,95,.28));transform:translateZ(0)}
.r-iris{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#norie{position:fixed;left:0;top:0;width:82px;height:82px;z-index:25;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}
#norie.held{cursor:grabbing}
#norie.held .rbt{transform:scale(1.08)}
.rbt{transition:transform .15s}

/* Speech bubble */
.nb{position:absolute;width:max-content;max-width:260px;padding:11px 15px;border-radius:18px;font-size:14px;font-weight:700;line-height:1.35;color:var(--ink);background:rgba(255,255,255,.96);border:1px solid var(--glass-b);box-shadow:0 8px 26px rgba(200,80,100,.3);pointer-events:none;z-index:50;white-space:normal;word-wrap:break-word}
.nb.up{bottom:calc(100% + 8px)} .nb.dn{top:calc(100% + 8px)}
.nb.r{right:0} .nb.l{left:0}
.nb::after{content:"";position:absolute;width:12px;height:12px;background:inherit;border:inherit;transform:rotate(45deg)}
.nb.up::after{bottom:-6px;border-top:0;border-left:0} .nb.dn::after{top:-6px;border-bottom:0;border-right:0}
.nb.r::after{right:34px} .nb.l::after{left:34px}
.nb.pop{animation:nbpop .28s cubic-bezier(.2,1.4,.3,1)}
@keyframes nbpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mini-av.ph{background:none;border:0;box-shadow:none;visibility:hidden;cursor:default}
#hello{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(255,248,238,.6);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#hello.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .3s}
.hello-av{width:min(64vw,270px);height:min(64vw,270px);font-size:min(46vw,190px);display:grid;place-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.hwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.hbub{min-height:46px;max-width:min(300px,84vw);padding:11px 18px;border-radius:18px;font-size:15px;font-weight:700;text-align:center;color:var(--ink);background:rgba(255,255,255,.92);border:1px solid var(--glass-b);box-shadow:0 8px 24px rgba(200,80,100,.2);transition:opacity .2s;pointer-events:none}
.hbub.off{opacity:0}
.hbub.pop{animation:nbpop .28s cubic-bezier(.2,1.4,.3,1)}
.hx{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:38px;height:38px;font-size:17px}
#hello.on .hello-av>*{animation:pop .5s cubic-bezier(.2,1.5,.3,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.datebox{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;min-height:56px;cursor:pointer;-webkit-user-select:none;user-select:none}
.datebox .dl{font-size:16px;font-weight:600}
.datebox .dv{font-size:16px;font-weight:700;color:var(--pink)}
.datebox .dv.on{color:var(--ink)}
.datebox:focus-visible{outline:3px solid rgba(244,104,127,.35)}
.datebox .dv.ph{color:var(--muted)}
.datebox .chev{color:var(--muted);font-size:13px;margin-left:6px;transition:transform .2s;display:inline-block}
.datebox[aria-expanded=true] .chev{transform:rotate(180deg)}
.cal{margin-top:8px;padding:10px 12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-h b{font-size:13.5px}
.cal-h,.cal-w,.cal-g{max-width:262px;margin-left:auto;margin-right:auto}
.cn{width:26px;height:26px;border:0;border-radius:50%;background:rgba(255,255,255,.75);color:var(--pink);font-size:16px;line-height:1;cursor:pointer;padding:0 0 2px}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-w span{font-size:10px;font-weight:700;color:var(--gold);padding:2px 0}
.cal-g{row-gap:0}
.cd{width:100%;max-width:30px;aspect-ratio:1;margin:auto;border:0;background:none;border-radius:50%;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0}
.cd:active{background:rgba(255,255,255,.8)}
.cd.td{box-shadow:inset 0 0 0 1.5px var(--pink2);color:var(--pink)}
.cd.sl{background:linear-gradient(145deg,#ff9aab,var(--pink));color:#fff;box-shadow:0 4px 12px rgba(244,104,127,.4)}
.cal-f{display:flex;align-items:center;gap:6px;margin-top:8px}
.cal-f .chip{padding:9px 11px;flex:none}
.cal-f input[type=time]{width:auto;flex:1;min-width:0;padding:8px 8px;font-size:15px;border-radius:13px}
.whenrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;min-height:0}
.whenrow .calnote{margin:0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="bar glass" id="bar"></nav>
<div id="shade"></div>
<div id="sheet" class="glass"></div>
<div id="toasts"></div>
<div id="hello"></div>

<script>
/* ---------- storage & cloud sync ---------- */
const KEY='petal.v1';
const defaultState={
  updatedAt:0,
  lists:[{id:'personal',name:'Personal',e:'🌸'},{id:'work',name:'Work',e:'💼'},{id:'home',name:'Home',e:'🏡'},{id:'shop',name:'Shopping',e:'🛍️'},{id:'health',name:'Health',e:'💗'}],
  tasks:[],
  settings:{tgToken:'',tgChat:'',gasUrl:'',nag:10,sound:true,name:'Yishak',greet:true,autoCal:true,robotPos:null,avatar:{type:'robot',emoji:'😊',photo:''}}
};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch(e){S=structuredClone(defaultState)}
S.settings=Object.assign({},defaultState.settings,S.settings||{});
S.settings.avatar=Object.assign({},defaultState.settings.avatar,S.settings.avatar||{});

const isTyping=()=>['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
const getUserKey=()=>((S.settings.name||'yishak').trim()||'yishak').toLowerCase();

async function syncToGas(){
  const url=(S.settings.gasUrl||'').trim();
  if(!url||!navigator.onLine)return false;
  try{
    const res=await fetch(url,{
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'save',userId:getUserKey(),payload:S})
    });
    return res.ok;
  }catch(_){return false;}
}

const save=()=>{
  try{
    S.updatedAt=Date.now();
    localStorage.setItem(KEY,JSON.stringify(S));
    syncToGas();
  }catch(e){alert('Storage full — clear space.')}
};

async function loadFromGas(force=false){
  const url=(S.settings.gasUrl||'').trim();
  if(!url||!navigator.onLine)return false;
  try{
    const res=await fetch(url,{
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'load',userId:getUserKey()})
    });
    const data=await res.json();
    if(data&&data.status==='ok'&&data.payload){
      const cloudTime=data.payload.updatedAt||0;
      const localTime=S.updatedAt||0;
      if(force||cloudTime>localTime){
        const keepUrl=S.settings.gasUrl;
        S=data.payload;
        S.settings=Object.assign({},defaultState.settings,S.settings||{});
        S.settings.avatar=Object.assign({},defaultState.settings.avatar,S.settings.avatar||{});
        S.settings.gasUrl=keepUrl;
        localStorage.setItem(KEY,JSON.stringify(S));
        if(!isTyping())render();
        return true;
      }
    }
    return false;
  }catch(_){return false;}
}

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()};
const DAY=864e5;
const fmtT=ms=>new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtD=ms=>new Date(ms).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
const pad=n=>String(n).padStart(2,'0');
const listOf=id=>S.lists.find(l=>l.id===id)||S.lists[0];
const myName=()=>(S.settings.name||'').trim()||'friend';
function dayLabel(ms){
  const t=sod(Date.now()),d=sod(ms);
  if(d===t)return'Today'; if(d===t+DAY)return'Tomorrow'; if(d===t-DAY)return'Yesterday';
  return fmtD(ms);
}

function setPhoto(file){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const s=256,c=document.createElement('canvas');c.width=c.height=s;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    S.settings.avatar={...S.settings.avatar,type:'photo',photo:c.toDataURL('image/png')};
    save();URL.revokeObjectURL(url);render();
  };
  img.onerror=()=>alert('Couldn’t read that image. Try PNG or JPG.');
  img.src=url;
}

/* ---------- parser ---------- */
function parseQuick(text){
  let title=text,due=null,repeat='none';
  const cut=re=>{const m=title.match(re);if(m)title=title.replace(re,' ');return m};
  let m,dayShift=null,hh=null,mm=0,rel=null;
  if(cut(/\b(every ?day|daily)\b/i))repeat='daily';
  else if(cut(/\b(every ?week|weekly)\b/i))repeat='weekly';
  else if(cut(/\b(every ?month|monthly)\b/i))repeat='monthly';
  if(m=cut(/\bin (\d+) ?(min(?:ute)?s?|m|hours?|hrs?|h)\b/i)){const n=+m[1];rel=/^h/i.test(m[2])?n*60:n}
  if(cut(/\btomorrow\b/i))dayShift=1; else if(cut(/\btoday\b/i))dayShift=0;
  if(m=cut(/\bat (\d{1,2})(?::(\d{2}))? ?(am|pm)?\b/i)||cut(/\b(\d{1,2})(?::(\d{2}))? ?(am|pm)\b/i)){
    hh=+m[1];mm=+(m[2]||0);const ap=(m[3]||'').toLowerCase();
    if(ap==='pm'&&hh<12)hh+=12; if(ap==='am'&&hh===12)hh=0;
  }
  if(rel!=null)due=Date.now()+rel*60000;
  else if(dayShift!=null||hh!=null){
    const d=new Date();d.setSeconds(0,0);
    if(dayShift)d.setDate(d.getDate()+dayShift);
    if(hh!=null)d.setHours(hh,mm); else d.setHours(9,0);
    if(dayShift==null&&d.getTime()<Date.now())d.setDate(d.getDate()+1);
    due=d.getTime();
  }
  if(due){const x=new Date(due);x.setSeconds(0,0);due=x.getTime()}
  title=title.replace(/\s+/g,' ').trim();
  return {title:title||text.trim(),due,repeat};
}

/* ---------- notifications ---------- */
function beep(){
  if(!S.settings.sound)return;
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    [880,1175].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';o.connect(g);g.connect(c.destination);
      const t=c.currentTime+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.start(t);o.stop(t+.4)});
  }catch(e){}
}
async function sysNotify(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opts={body,tag,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200],renotify:true};
  try{const r=await navigator.serviceWorker.ready;await r.showNotification(title,opts)}
  catch(e){try{new Notification(title,opts)}catch(_){}}
}
async function sendTelegram(text){

function toast(t,{title,body}){

  el.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
    if(a==='done')complete(t.id); else {t.snooze=Date.now()+(+a)*60000;save();}

function fire(t){
  const body=`${listOf(t.list).e} ${listOf(t.list).name} · ${t.due?fmtT(t.due):''}${t.notes?'\n'+t.notes:''}`;
  t.lastFired=Date.now();t.fires=(t.fires||0)+1;t.snooze=null;save();
  sysNotify(t.title,body,t.id);
  sendTelegram(`🔔 Norie here! Hey ${myName()}, reminder:\n${t.title}\n${listOf(t.list).e} ${listOf(t.list).name}${t.due?' • '+dayLabel(t.due)+' '+fmtT(t.due):''}${t.fires>1?`\n(reminder #${t.fires})`:''}`);
  beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);
  toast(t,{title:t.title,body:`${t.fires>1?'Reminder #'+t.fires+' · ':''}${t.due?fmtT(t.due):''} ${t.notes||''}`});
}
function tick(){
  const now=Date.now();let any=false;
  for(const t of S.tasks){
    if(t.done||!t.due)continue;
    const nag=t.nag??S.settings.nag;
    let next;
    if(t.snooze)next=t.snooze;
    else if(!t.lastFired||t.lastFired<t.due-1000)next=t.due;
    else next=nag>0?t.lastFired+nag*60000:Infinity;
    if(now>=next){fire(t);any=true}
  }
  if(any&&!isTyping())render();
}

/* ---------- task ops ---------- */
function complete(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(t.repeat&&t.repeat!=='none'&&t.due){
    const d=new Date(t.due);
    do{ if(t.repeat==='daily')d.setDate(d.getDate()+1); else if(t.repeat==='weekly')d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1);}while(d.getTime()<=Date.now());
    t.due=d.getTime();t.lastFired=null;t.fires=0;t.snooze=null;
  }else{t.done=!t.done;t.doneAt=t.done?Date.now():null}
  save();render();
  if(typeof norieCheer==='function'&&(t.done||(t.repeat&&t.repeat!=='none')))norieCheer();
}
const appURL=()=>location.href.split('#')[0];
function icsFor(t){
  const f=ms=>{const d=new Date(ms);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`};
  const rr={daily:'FREQ=DAILY',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY'}[t.repeat];
  const e=s=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const link=`${appURL()}#t=${t.id}`;
  const desc=[t.notes,`Open in Norie: ${link}`].filter(Boolean).join('\n\n');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Norie//EN','BEGIN:VEVENT',`UID:${t.id}@norie`,`DTSTAMP:${f(Date.now())}`,`DTSTART:${f(t.due)}`,`DTEND:${f(t.due+15*60000)}`,`SUMMARY:${e(t.title)}`,`DESCRIPTION:${e(desc)}`,`URL:${link}`,rr?`RRULE:${rr}`:null,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${e(t.title)}`,'TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean);
  return lines.join('\r\n');
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function addToCalendar(t){
  if(!t||!t.due)return;
  const ics=icsFor(t),name=(t.title||'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'reminder';
  if(isIOS&&navigator.canShare){
    try{
      const file=new File([ics],name+'.ics',{type:'text/calendar'});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  download(name+'.ics',ics,'text/calendar;charset=utf-8');
}
function openFromHash(){
  const m=location.hash.match(/t=([\w-]+)/);if(!m)return false;
  const t=S.tasks.find(x=>x.id===m[1]);
  history.replaceState(null,'',location.pathname+location.search);
  if(!t)return false;
  tab='today';curList=null;render();openSheet(t);return true;
}
window.addEventListener('hashchange',openFromHash);

function bar(){

function rowHTML(t){
  const now=Date.now(),late=t.due&&!t.done&&t.due<now;
  const L=listOf(t.list);
  return `<div class="row ${t.done?'done':''}" data-id="${t.id}">
    <div class="chk" data-c="${t.id}"></div>
    <div style="min-width:0;flex:1"><div class="t">${esc(t.title)}</div>
    <div class="m">${t.prio?`<span><i class="dot p${t.prio}"></i>${t.prio===2?'Important':'Medium'}</span>`:''}
      <span>${L.e} ${esc(L.name)}</span>
      ${t.due?`<span class="${late?'late':''}">${dayLabel(t.due)}, ${fmtT(t.due)}</span>`:''}
      ${t.repeat&&t.repeat!=='none'?`<span>🔁 ${t.repeat}</span>`:''}
    </div></div></div>`;
}
const sortT=(a,b)=>(a.due??1e15)-(b.due??1e15)||b.prio-a.prio;
function section(title,arr,cls=''){
  if(!arr.length)return'';
  return `<h2 class="${cls}">${title}</h2><div class="card glass">${arr.map(rowHTML).join('')}</div>`;
}
function vToday(){
  const t0=sod(Date.now()),open=S.tasks.filter(t=>!t.done);
  const over=open.filter(t=>t.due&&t.due<t0).sort(sortT);
  const today=open.filter(t=>t.due&&t.due>=t0&&t.due<t0+DAY).sort(sortT);
  const inbox=open.filter(t=>!t.due).sort((a,b)=>b.prio-a.prio);
  const doneToday=S.tasks.filter(t=>t.done&&t.doneAt>=t0);
  const total=today.length+doneToday.length+over.length;
  const pct=total?doneToday.length/total:0;
  const C=2*Math.PI*26;
  return `<div class="hdr"><div><p class="hi">${timeWord()}</p><h1 style="margin-top:0">${esc(myName())} ✨</h1><p class="sub" style="margin-bottom:10px">${new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}</p></div>
  <div class="mini-av${S.settings.avatar.type==='robot'?' ph':''}" data-hello title="Norie says hi">${S.settings.avatar.type==='robot'?'':avatarHTML()}</div></div>
  <div class="ring glass"><svg width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9aab"/><stop offset="1" stop-color="#e5b95a"/></linearGradient></defs>
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(200,150,46,.18)" stroke-width="7"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 32 32)"/></svg>
  <div><b>${total?`${doneToday.length} of ${total} done`:'Nothing planned yet'}</b><div class="sub" style="margin:2px 0 0">${total&&doneToday.length===total?'All clear — lovely work 💗':'Tap + to add a task'}</div></div></div>
  ${section('Overdue',over,'over')}${section('Today',today)}${section('Inbox · no time',inbox)}
  ${!over.length&&!today.length&&!inbox.length?'<div class="empty glass" style="margin-top:14px">🌷<br>You are all caught up.</div>':''}
  ${doneToday.length?`<details style="margin-top:14px"><summary>Completed today (${doneToday.length})</summary><div class="card glass">${doneToday.map(rowHTML).join('')}</div></details>`:''}`;
}
function vUpcoming(){
  const t1=sod(Date.now())+DAY;
  const arr=S.tasks.filter(t=>!t.done&&t.due&&t.due>=t1).sort(sortT);
  const groups={};arr.forEach(t=>{const k=sod(t.due);(groups[k]=groups[k]||[]).push(t)});
  return `<h1>Upcoming</h1><p class="sub">${arr.length} planned ahead</p>
  ${Object.keys(groups).map(k=>section(dayLabel(+k),groups[k])).join('')||'<div class="empty glass">Nothing scheduled ahead. 🌙</div>'}`;
}
function vLists(){
  if(curList){
    const L=listOf(curList),arr=S.tasks.filter(t=>t.list===curList);
    return `<h1>${L.e} ${esc(L.name)}</h1><p class="sub"><a href="#" data-back>‹ All lists</a></p>
    ${section('To do',arr.filter(t=>!t.done).sort(sortT))}${section('Completed',arr.filter(t=>t.done))}
    ${!arr.length?'<div class="empty glass">No tasks here yet.</div>':''}
    <div class="btns"><button class="btn danger small" data-dellist="${L.id}">Delete list</button></div>`;
  }
  return `<h1>Lists</h1><p class="sub">Everything, neatly organised</p>
  ${S.lists.map(l=>`<div class="lcard glass" data-list="${l.id}"><div class="e">${l.e}</div><div class="n">${esc(l.name)}</div><div class="c">${S.tasks.filter(t=>t.list===l.id&&!t.done).length}</div></div>`).join('')}
  <div class="btns"><button class="btn gold" id="newlist">+ New list</button></div>`;
}

function render(){
  bar();

  $('#app').innerHTML={today:vToday,upcoming:vUpcoming,lists:vLists,settings:vSettings}[tab]();

/* ---------- interactions ---------- */
$('#app').addEventListener('click',async e=>{
  const T=e.target;
  if(T.closest('[data-hello]')){showHello();return}
  const c=T.closest('[data-c]');if(c){complete(c.dataset.c);return}
  const r=T.closest('.row');if(r){openSheet(S.tasks.find(t=>t.id===r.dataset.id));return}
  if(T.closest('[data-back]')){e.preventDefault();curList=null;render();return}
  const l=T.closest('[data-list]');if(l){curList=l.dataset.list;render();return}
  const av=T.closest('[data-av]');if(av){S.settings.avatar.type=av.dataset.av;save();render();return}
  const em=T.closest('[data-em]');if(em){S.settings.avatar.emoji=em.dataset.em;save();render();return}
  if(T.id==='av_pick'){$('#av_file').click();return}
  if(T.id==='newlist'){const n=prompt('List name?');if(n){const em=prompt('Emoji?','✨')||'✨';S.lists.push({id:uid(),name:n.trim(),e:em.trim().slice(0,4)});save();render()}return}
  const dl=T.dataset.dellist;if(dl){if(S.lists.length<2)return alert('Keep at least one list.');if(confirm('Delete this list?')){S.tasks.forEach(t=>{if(t.list===dl)t.list=S.lists.find(x=>x.id!==dl).id});S.lists=S.lists.filter(x=>x.id!==dl);curList=null;save();render()}return}
  if(T.id==='askperm'){await Notification.requestPermission();render();return}
  if(T.id==='testn'){await sysNotify('Norie 🤖','Notifications working!','test');beep();toast({id:'x'},{title:'Test',body:'Reminders look like this.'});return}
  if(T.id==='gaspull'){
    const url=$('#gas_url').value.trim();
    if($('#s_name')?.value.trim())S.settings.name=$('#s_name').value.trim();
    S.settings.gasUrl=url;
    localStorage.setItem(KEY,JSON.stringify(S));
    $('#gasstat').className='status ok';$('#gasstat').textContent='Pulling from cloud...';
    const ok=await loadFromGas(true);
    const stEl=$('#gasstat');
    if(stEl){
      stEl.className='status '+(ok?'ok':'no');
      stEl.textContent=ok?`Pulled ${S.tasks.length} tasks from cloud ✓`:'No cloud data found for this name, or check URL.';
    }
    return;
  }
  if(T.id==='gaspush'){
    const url=$('#gas_url').value.trim();
    if($('#s_name')?.value.trim())S.settings.name=$('#s_name').value.trim();
    S.settings.gasUrl=url;
    S.updatedAt=Date.now();
    localStorage.setItem(KEY,JSON.stringify(S));
    $('#gasstat').className='status ok';$('#gasstat').textContent='Uploading to cloud...';
    const ok=await syncToGas();
    $('#gasstat').className='status '+(ok?'ok':'no');
    $('#gasstat').textContent=ok?`Uploaded ${S.tasks.length} tasks to cloud ✓`:'Upload failed — check Web App URL.';
    return;
  }
  if(T.id==='tgsave'){S.settings.tgToken=$('#tgt').value.trim();S.settings.tgChat=$('#tgc').value.trim();save();const ok=await sendTelegram(`🤖 Hi ${myName()}, it’s Norie! Connected.`);$('#tgstat').className='status '+(ok?'ok':'no');$('#tgstat').textContent=ok?'Sent! Check Telegram ✓':'Error connecting Telegram.';return}
  if(T.id==='exp'){download('norie-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1),'application/json');return}
  if(T.id==='imp'){$('#impf').click();return}
});
$('#app').addEventListener('input',e=>{
  if(e.target.id==='s_name'){S.settings.name=e.target.value;localStorage.setItem(KEY,JSON.stringify(S))}
  if(e.target.id==='s_emoji'){S.settings.avatar.emoji=e.target.value;saveSoon()}
  if(e.target.id==='gas_url'){S.settings.gasUrl=e.target.value.trim();localStorage.setItem(KEY,JSON.stringify(S))}
});
$('#app').addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='nag'){S.settings.nag=+e.target.value;save()}
  if(id==='snd'){S.settings.sound=e.target.checked;save()}
  if(id==='s_greet'){S.settings.greet=e.target.checked;save()}
  if(id==='s_cal'){S.settings.autoCal=e.target.checked;save()}
  if(id==='av_file'){const f=e.target.files[0];if(f)setPhoto(f)}
  if(id==='impf'){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.tasks||!d.lists)throw 0;if(confirm('Restore backup?')){S=d;save();render()}}catch(_){alert('Invalid backup file.')}})}
});

/* ---------- sheet & calendar ---------- */
let editing=null,draft={};
$('#fab').onclick=()=>openSheet(null);
$('#shade').onclick=closeSheet;
function closeSheet(){$('#sheet').classList.remove('on');$('#shade').classList.remove('on')}
function sumUpdate(){
  const el=$('#f_sum');if(!el)return;
  if(draft.due){el.className='dv on';el.textContent=dayLabel(draft.due)+', '+fmtT(draft.due)}
  else{el.className='dv ph';el.textContent='Today · '+new Date().toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}
  $('#f_clr').hidden=!draft.due;
  $('#f_cal').textContent=draft.due?(S.settings.autoCal?'📅 Added to Calendar':''):'No reminder yet';
}
let calY=0,calM=0;
function defTime(){const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);return d}
function calRender(){
  const p=$('#f_calp');if(!p||p.hidden)return;
  const first=new Date(calY,calM,1),dim=new Date(calY,calM+1,0).getDate(),today=sod(Date.now()),sel=draft.due?sod(draft.due):null;
  let cells='';
  for(let i=0;i<first.getDay();i++)cells+='<i></i>';
  for(let d=1;d<=dim;d++){const ts=new Date(calY,calM,d).getTime();
    cells+=`<button type="button" class="cd${ts===today?' td':''}${ts===sel?' sl':''}" data-cd="${ts}">${d}</button>`}
  const tv=draft.due?new Date(draft.due):defTime();
  p.innerHTML=`<div class="cal-h"><button type="button" class="cn" data-cn="-1">‹</button><b>${first.toLocaleDateString([], {month:'long',year:'numeric'})}</b><button type="button" class="cn" data-cn="1">›</button></div>
  <div class="cal-w">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="cal-g">${cells}</div>
  <div class="cal-f"><button type="button" class="chip" data-cq="0">Today</button><button type="button" class="chip" data-cq="1">Tomorrow</button><input type="time" id="f_time" value="${pad(tv.getHours())}:${pad(tv.getMinutes())}"><button type="button" class="chip on" id="f_cdone">Done</button></div>`;
}
function calToggle(force){
  const p=$('#f_calp'),r=$('#f_row');if(!p)return;
  const open=force===undefined?p.hidden:force;
  p.hidden=!open;r.setAttribute('aria-expanded',open);
  if(open){const b=draft.due?new Date(draft.due):new Date();calY=b.getFullYear();calM=b.getMonth();calRender()}
}
function calSetDay(ts){
  const base=draft.due?new Date(draft.due):defTime(),d=new Date(+ts);
  d.setHours(base.getHours(),base.getMinutes(),0,0);
  draft.manual=true;draft.due=d.getTime();calY=d.getFullYear();calM=d.getMonth();sumUpdate();calRender();
}

function saveSheet(){
  let title=$('#f_title').value.trim();if(!title){$('#f_title').focus();return}

/* ---------- norie animation & engine ---------- */
const NSZ=82;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const NR={shakeAcc:0,shakeAccT:0,dizzyUntil:0,bigExpr:'happy',bigUntil:0,clicks:[],hbT:0,mx:innerWidth/2,my:innerHeight/3,lastMove:0,tx:0,ty:0,tiltAt:0,shakeUntil:0,shakeStamp:0,
  mode:'home',taskId:null,arrived:false,arriveT:0,stayUntil:0,nextAt:0,visited:0,

const EXP={
  calm:{cover:.06,tilt:0,sq:0,m:.55,o:.04,teeth:0,pupil:1,tint:0,vein:0},
  meh:{cover:.24,tilt:6,sq:.1,m:-.1,o:.05,teeth:0,pupil:.92,tint:.12,vein:0},

  held:{cover:-.2,tilt:-6,sq:0,m:-.1,o:.85,teeth:0,pupil:1.3,tint:0,vein:0},

for(const k in EXP)EXP[k]=Object.assign({dizzy:0,ache:0},EXP[k]);
const clampPos=(x,y)=>({x:clamp(x,4,innerWidth-NSZ-4),y:clamp(y,4,innerHeight-NSZ-4)});

function homePos(){
  const p=S.settings.robotPos;
  if(p&&isFinite(p.fx)&&isFinite(p.fy))return clampPos(p.fx*innerWidth-NSZ/2,p.fy*innerHeight-NSZ/2);

var ORc=null,ORt=0;

    const b=r.getBoundingClientRect(),cy=b.top+b.height/2;

  });
  out.sort((a,b)=>b.late-a.late);
  ORc=out;ORt=nw;return out;
}
function rowTarget(row){

  return clampPos(b.right-NSZ-4,b.top+b.height/2-NSZ/2);
}

const NLINES=[t=>`Ugh… “${t}” is STILL not done.`,t=>`Seriously? ${t}. Do it already.`,t=>`${t}… I’m watching you 👀`,()=>`Tap the circle. Just tap it.`,t=>`Still waiting on “${t}”.`];
function nPlace(){

function nSay(txt,ms){

function nSpeak(row){

function norieCheer(){

function nHSay(txt,ms){

  clearTimeout(NR.hbT);NR.hbT=setTimeout(()=>b.classList.add('off'),ms);

}
function nPoke(){
  const now=performance.now();
  NR.clicks=(NR.clicks||[]).filter(t=>now-t<3000);NR.clicks.push(now);
  if(NR.clicks.length>=5){
    NR.clicks=[];NR.bigExpr='mad';NR.bigUntil=now+3800;
    nHSay(rand(['STOP POKING ME!!','THAT’S ENOUGH 😤']),3300);
  }else if(!(NR.bigExpr==='mad'&&now<NR.bigUntil)){
    NR.bigExpr='ache';NR.bigUntil=now+1800;
    nHSay('Ow! Headache… 🤕',1700);
  }
}
function nBigExpr(now){return now<NR.dizzyUntil?'dizzy':now<NR.bigUntil?NR.bigExpr:'happy'}
function nShake(a){
  const now=performance.now();
  NR.shakeAcc=Math.max(0,NR.shakeAcc-(now-NR.shakeAccT)/1000*.6)+a;NR.shakeAccT=now;
  if(NR.shakeAcc>2.2&&now>NR.dizzyUntil){
    NR.shakeAcc=0;NR.dizzyUntil=now+4800;NR.shakeUntil=0;
    nSay('Everything’s spinning 😵‍💫',3800);
  }
}
function nextTask(rows,now){
  if(NR.visited>=3){NR.visited=0;NR.mode='home';NR.taskId=null;NR.nextAt=now+9000;return}
  const idx=rows.findIndex(r=>r.id===NR.taskId),r=rows[(idx+1)%rows.length];
  NR.mode='task';NR.taskId=r.id;NR.arrived=false;
}
function nLogic(now){
  const T=NPOS;
  if(NR.held){NR.expr='held';return}
  let expr='calm';
  if(now<NR.dizzyUntil)expr='dizzy';
  else if(now<NR.shakeUntil)expr='held';
  else if(now<NR.forcedUntil)expr=NR.forced;
  const busy=$('#sheet').classList.contains('on')||$('#hello').classList.contains('on');
  if(busy){NR.expr=expr;return}
  if(now<NR.pauseUntil){NR.expr=expr;return}
  const rows=openRows();
  if(REDUCED||!rows.length){
    NR.mode='home';NR.taskId=null;const h=homePos();T.tx=h.x;T.ty=h.y;
    if(expr==='calm')expr=S.tasks.some(t=>!t.done)?'meh':'happy';
    NR.expr=expr;return;
  }
  if(NR.mode==='task'){
    const item=rows.find(r=>r.id===NR.taskId);
    if(!item){NR.mode='home';NR.taskId=null;NR.nextAt=now+700}
    else{
      const g=rowTarget(item.el);T.tx=g.x;T.ty=g.y;
      if(!NR.arrived&&Math.hypot(T.x-g.x,T.y-g.y)<16){NR.arrived=true;NR.arriveT=now;NR.stayUntil=now+5600;nSpeak(item.el)}
      if(NR.arrived&&now>NR.stayUntil){NR.visited++;nextTask(rows,now)}
    }
  }
  if(NR.mode==='home'){
    const h=homePos();T.tx=h.x;T.ty=h.y;
    if(now>NR.nextAt)nextTask(rows,now);
  }
  if(expr==='calm')expr=NR.mode==='task'?'mad':'meh';
  NR.expr=expr;
}
function nPhys(dt){
  const P=NPOS;if(NR.held)return;
  const k=70,c=2*Math.sqrt(k)*.85;
  P.vx+=(k*(P.tx-P.x)-c*P.vx)*dt;P.vy+=(k*(P.ty-P.y)-c*P.vy)*dt;
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  const q=clampPos(P.x,P.y);P.x=q.x;P.y=q.y;
}

function nGaze(now,cx,cy,st){
  if(now-NR.lastMove<4500)return{x:NR.mx,y:NR.my};
  if(now-NR.tiltAt<1800)return{x:cx+NR.tx*380,y:cy+NR.ty*380};
  if(now>NR.wanderAt){NR.wanderAt=now+2200+Math.random()*3200;NR.wx=innerWidth*(.15+Math.random()*.7);NR.wy=innerHeight*(.1+Math.random()*.7)}
  return{x:NR.wx,y:NR.wy};
}
const NI=new WeakMap();
function nInit(el){
  const P={};el.querySelectorAll('[data-p]').forEach(n=>P[n.dataset.p]=n);
  const st={P,hx:0,hy:0,ex:0,ey:0,roll:0,rv:0,ant:0,av:0,E:{...EXP.calm},bt:-1e9,nextBlink:performance.now()+1500,
    sx:0,sy:0,sxt:0,syt:0,sacAt:0,seenShake:0,float:!!el.closest('#norie'),threeD:el.querySelector('.rbt-3d'),
    rect:{left:0,top:0,width:NSZ,height:NSZ}};
  NI.set(el,st);return st;
}
function mouthPath(m,o,w,cy=184,cx=120){
  const h=3+o*17,corner=cy-m*7,mid=cy+m*8,cu=2*(mid-h/2)-corner,cl=2*(mid+h/2)-corner,x1=cx-w,x2=cx+w,f=n=>n.toFixed(2);
  return{lens:`M${f(x1)} ${f(corner)}Q${cx} ${f(cu)} ${f(x2)} ${f(corner)}Q${cx} ${f(cl)} ${f(x1)} ${f(corner)}Z`,mid:`M${f(x1)} ${f(corner)}Q${cx} ${f(2*mid-corner)} ${f(x2)} ${f(corner)}`};
}
const sa=(n,k,v)=>{if(!n)return;const c=n._c||(n._c={});if(c[k]!==v){c[k]=v;n.setAttribute(k,v)}};

function nStep(el,dt,now){
  const st=NI.get(el)||nInit(el),P=st.P,E=st.E;
  const cx=st.float?NPOS.x+NSZ/2:innerWidth/2;
  const cy=st.float?NPOS.y+NSZ*.52:innerHeight*.45;
  
  const g=nGaze(now,cx,cy,st),nx=Math.tanh((g.x-cx)/240),ny=Math.tanh((g.y-cy)/240);
  const a=1-Math.exp(-dt*5.5),b=1-Math.exp(-dt*18);
  st.hx+=(nx-st.hx)*a;st.hy+=(ny-st.hy)*a;
  if(now>st.sacAt){st.sacAt=now+400+Math.random()*900;st.sxt=(Math.random()-.5)*1.6;st.syt=(Math.random()-.5)*1.2}
  st.sx+=(st.sxt-st.sx)*b;st.sy+=(st.syt-st.sy)*b;
  const ex=clamp((nx-st.hx*.72)*11+st.sx+st.hx*2,-7.5,7.5),ey=clamp((ny-st.hy*.72)*9+st.sy+st.hy*1.5,-6.5,6.5);
  st.ex+=(ex-st.ex)*b;st.ey+=(ey-st.ey)*b;
  
  const tgt=EXP[st.float?NR.expr:nBigExpr(now)]||EXP.calm,k=1-Math.exp(-dt*7);
  for(const key in tgt)E[key]+=(tgt[key]-E[key])*k;
  if(now>st.nextBlink){st.bt=now;st.nextBlink=now+(Math.random()<.2?260:2200+Math.random()*4200)}
  const u=(now-st.bt)/150,blink=u>=0&&u<1?Math.sin(u*Math.PI):0;
  const talk=now<NR.talkUntil?.3+.4*Math.abs(Math.sin(now/95)):0;
  const cover=Math.max(E.cover+Math.max(0,st.ey)*.012,blink*1.12);
  const R=22.6,bY=-R+cover*2*R,sxs=1-Math.abs(st.ex)/80,sys=1-Math.abs(st.ey)/100;
  for(const [s,dir] of [['l',1],['r',-1]]){
    sa(P['lid-'+s],'transform',`rotate(${(E.tilt*dir).toFixed(2)}) translate(0 ${bY.toFixed(2)})`);
    sa(P['llid-'+s],'transform',`rotate(${(E.tilt*dir*.3).toFixed(2)}) translate(0 ${(27-E.sq*13).toFixed(2)})`);
    sa(P['iris-'+s],'transform',`translate(${st.ex.toFixed(2)} ${st.ey.toFixed(2)}) scale(${sxs.toFixed(3)} ${sys.toFixed(3)})`);
    sa(P['pup-'+s],'r',(5.8*clamp(E.pupil,.5,1.5)).toFixed(2));
    sa(P['redi-'+s],'opacity',(E.tint*.75).toFixed(2));
  }
  
  const hx=st.hx+E.ache*Math.sin(now/55)*.28+E.dizzy*Math.sin(now/230)*.5,hy=st.hy+E.ache*.25+E.dizzy*Math.sin(now/310)*.25,f=n=>n.toFixed(2);
  sa(P.visor,'transform',`translate(${f(hx*9)} ${f(hy*5.5)})`);
  sa(P.eyes,'transform',`translate(${f(hx*5)} ${f(hy*3)})`);
  sa(P.glare,'transform',`translate(${f(-hx*5)} ${f(-hy*3)})`);
  sa(P.mouth,'transform',`translate(${f(hx*10)} ${f(hy*6)})`);
  sa(P.sheen,'transform',`translate(${f(-hx*12)} ${f(-hy*7)})`);
  sa(P['ear-l'],'transform',`translate(21 0) scale(${f(1+hx*.35)} 1) translate(-21 0)`);
  sa(P['ear-r'],'transform',`translate(219 0) scale(${f(1-hx*.35)} 1) translate(-219 0)`);
  
  const mp=mouthPath(E.m+E.dizzy*Math.sin(now/130)*.6+E.ache*Math.sin(now/45)*.15,clamp(E.o+talk,0,1),25+E.teeth*3);
  for(const id of ['m-hi','m-sh','m-dk','m-clip'])sa(P[id],'d',mp.lens);
  for(const id of ['m-gl','m-gl-b','m-seam'])sa(P[id],'d',mp.mid);
  sa(P.teeth,'opacity',E.teeth.toFixed(2));
  const col=mixHex('#ff8fa0','#ff2a3d',E.tint);
  sa(P['m-gl'],'stroke',col);sa(P['m-gl-b'],'stroke',col);
  sa(P['m-gl'],'opacity',(1-E.teeth*.92).toFixed(2));sa(P['m-gl-b'],'opacity',(.55*(1-E.teeth*.8)).toFixed(2));
  for(const id of ['led-l','led-r','ant-led','halo'])sa(P[id],'fill',col);
  sa(P.tint,'opacity',(E.tint*.6).toFixed(2));
  sa(P.flush,'opacity',(E.tint*.55).toFixed(2));
  sa(P.vein,'opacity',E.vein.toFixed(2));
  
  const vx=st.float?(NR.held?NR.vx:NPOS.vx):0;
  if(st.float&&NR.shakeStamp!==st.seenShake){st.seenShake=NR.shakeStamp;st.rv+=(Math.random()<.5?-1:1)*(300+Math.random()*250)}
  const tilt=now-NR.tiltAt<1800?NR.tx*9:0;
  const rollT=clamp(vx*.022,-16,16)+tilt+E.dizzy*Math.sin(now/200)*9;
  st.rv+=(120*(rollT-st.roll)-9*st.rv)*dt;st.roll+=st.rv*dt;
  const aT=-st.roll*1.3-hx*8;
  st.av+=(140*(aT-st.ant)-6*st.av)*dt;st.ant+=st.av*dt;
  sa(P.ant,'transform',`rotate(${clamp(st.ant,-35,35).toFixed(2)} 120 36)`);
  
  const t3=`rotateX(${f(-hy*13)}deg) rotateY(${f(hx*22)}deg) rotateZ(${f(st.roll)}deg)`;
  if(st.t3!==t3){st.t3=t3;st.threeD.style.transform=t3}
}

let nLast=performance.now(),nEl=null,nBub=null,nHello=null;
function nFrame(now){
  const dt=Math.min(.05,Math.max(.001,(now-nLast)/1000));nLast=now;
  const el=nEl||(nEl=$('#norie')),on=el&&el.style.display!=='none';
  if(on){
    nLogic(now);nPhys(dt);
    if(NR.held)NR.vx*=Math.exp(-dt*5);
    const bob=NR.held||REDUCED?0:Math.sin(now/650)*2.6;
    el.style.transform=`translate3d(${NPOS.x.toFixed(1)}px,${(NPOS.y+bob).toFixed(1)}px,0)`;
    const bub=nBub||(nBub=$('#nbub'));
    if(!bub.hidden){if(now>NR.bubUntil)bub.hidden=true;else nPlace()}
  }
  const hello=(nHello||(nHello=$('#hello'))).classList.contains('on');
  if(on||hello){
    document.querySelectorAll('.rbt').forEach(r=>{
      if(r.closest('#hello')){if(!hello)return}
      else if(!on)return;
      nStep(r,dt,now);
    });
  }
  requestAnimationFrame(nFrame);
}

function nDrag(el){
  let d=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    d={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:NPOS.x,oy:NPOS.y,moved:false,lt:performance.now()};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  el.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id)return;
    const dx=e.clientX-d.sx,dy=e.clientY-d.sy;
    if(!d.moved&&Math.hypot(dx,dy)<6)return;
    if(!d.moved){d.moved=true;NR.held=true;el.classList.add('held');$('#nbub').hidden=true}
    const now=performance.now(),dt=Math.max(.008,(now-d.lt)/1000),p=clampPos(d.ox+dx,d.oy+dy);
    NR.vx+=((p.x-NPOS.x)/dt-NR.vx)*.35;
    NPOS.x=NPOS.tx=p.x;NPOS.y=NPOS.ty=p.y;NPOS.vx=NPOS.vy=0;d.lt=now;
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id)return;
    const was=d;d=null;
    if(was.moved){
      NR.held=false;el.classList.remove('held');
      NR.pauseUntil=performance.now()+25000;NR.mode='home';NR.taskId=null;NR.nextAt=NR.pauseUntil+500;
      NPOS.tx=NPOS.x;NPOS.ty=NPOS.y;
      S.settings.robotPos={fx:(NPOS.x+NSZ/2)/innerWidth,fy:(NPOS.y+NSZ/2)/innerHeight};save();
    }else if(e.type==='pointerup')showHello(true);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

let tiltOn=false;
function nTilt(){
  if(tiltOn)return;tiltOn=true;
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null||e.beta==null)return;
    const x=clamp(e.gamma/30,-1,1),y=clamp((e.beta-45)/30,-1,1);
    NR.tx=x;NR.ty=y;
  },true);
  let lx=0,ly=0,lz=0;
  addEventListener('devicemotion',e=>{
    const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
    const d=Math.abs(a.x-lx)+Math.abs(a.y-ly)+Math.abs(a.z-lz);lx=a.x;ly=a.y;lz=a.z;
    if(d>28&&!REDUCED){NR.shakeUntil=performance.now()+1700;NR.shakeStamp=performance.now();nShake(d/45)}
  },true);
}
function nAskMotion(){
  const O=window.DeviceOrientationEvent,M=window.DeviceMotionEvent;
  if(O&&typeof O.requestPermission==='function'){
    O.requestPermission().then(r=>{if(r==='granted')nTilt()}).catch(()=>{});
    if(M&&typeof M.requestPermission==='function')M.requestPermission().catch(()=>{});
  }else if(O)nTilt();
}
function syncNorie(){
  const el=$('#norie');if(!el)return;
  const on=S.settings.avatar.type==='robot';
  el.style.display=on?'block':'none';
  if(!on)$('#nbub').hidden=true;
}
function initNorie(){
  const el=document.createElement('div');
  el.id='norie';el.setAttribute('role','img');el.setAttribute('aria-label','Norie the robot');
  el.innerHTML=robotSVG()+'<div id="nbub" class="nb" hidden></div>';
  document.body.appendChild(el);
  const h=homePos();Object.assign(NPOS,{x:h.x,y:h.y,tx:h.x,ty:h.y});
  NR.nextAt=performance.now()+4800;
  nDrag(el);syncNorie();
  const track=(x,y)=>{NR.mx=x;NR.my=y;NR.lastMove=performance.now()};
  addEventListener('pointermove',e=>track(e.clientX,e.clientY),{passive:true});
  addEventListener('resize',()=>{const p=clampPos(NPOS.x,NPOS.y);NPOS.x=NPOS.tx=p.x;NPOS.y=NPOS.ty=p.y});
  requestAnimationFrame(nFrame);
}

/* ---------- boot ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();tick();loadFromGas();
const fromLink=openFromHash();
initNorie();
if(!fromLink&&S.settings.greet!==false)showHello();
</script>
